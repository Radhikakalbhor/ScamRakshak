name: scam_rakshak
description: "ScamRakshak - Offline-first Flutter app for scam detection, prevention, and reporting."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/rules/
    - assets/samples/
    - assets/lessons/
    - assets/quiz/
    - assets/data/

  fonts:
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
