
name: scam_rakshak
description: "ScamRakshak - Offline-first Flutter app for scam detection, prevention, and reporting."
publish_to: "none"
version: 1.0.0+2016

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  file_picker: ^10.3.10
  http: ^1.2.0
  shared_preferences: ^2.3.0
  record: ^6.1.1
  wakelock_plus: ^1.3.2
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  flutter_foreground_task: ^9.1.0
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  mobile_scanner: 7.0.1
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/rules/
    - assets/samples/
    - assets/samples/live/
    - assets/samples/live/audio/
    - assets/lessons/
    - assets/quiz/
    - assets/data/

  fonts:
    # Design system font (design/DESIGN_SYSTEM.md). Inter Tight 5.2.5 static, OFL (assets/fonts/OFL-InterTight.txt).
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700
    # Devanagari (Hindi / Chhattisgarhi) at matching weights. Noto Sans Devanagari 5.2.6 static, OFL.
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
